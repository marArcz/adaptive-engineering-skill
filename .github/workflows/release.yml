name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo 'Expected a version tag such as v0.4.1 or v0.4.1-rc.1' >&2
            exit 1
          fi

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Package release
        shell: bash
        run: |
          mkdir -p dist
          archive="dist/adaptive-engineering-$RELEASE_TAG.zip"
          git archive --format=zip --prefix="adaptive-engineering-$RELEASE_TAG/" \
            --output="$archive" HEAD -- \
            .agents/skills/adaptive-engineering .agents/plugins .codex-plugin assets \
            vault-template tests \
            install.py init_vault.py configure.py AGENTS.example.md \
            README.md SETUP-AND-ACCEPTANCE.md
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          cd dist
          sha256sum "adaptive-engineering-$RELEASE_TAG.zip" > SHA256SUMS

      - name: Test extracted bundle
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from zipfile import ZipFile

          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              with ZipFile(os.environ['ARCHIVE']) as archive:
                  archive.extractall(root)
              bundle = root / f"adaptive-engineering-{os.environ['RELEASE_TAG']}"
              subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-v'],
                             cwd=bundle, check=True)
              project = root / 'project'
              project.mkdir()
              subprocess.run([sys.executable, str(bundle / 'install.py'), '--target', 'repo',
                              '--repo', str(project), '--with-agents'], check=True)
              subprocess.run([sys.executable, str(bundle / 'init_vault.py'),
                              '--path', str(root / 'vault')], check=True)
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$ARCHIVE" dist/SHA256SUMS \
            --verify-tag --title "Adaptive Engineering $RELEASE_TAG" \
            --generate-notes "${flags[@]}"
