name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo 'Expected a version tag such as v0.4.1 or v0.4.1-rc.1' >&2
            exit 1
          fi

      - name: Run deterministic acceptance checks
        run: python run_acceptance.py --output dist/acceptance-source.json

      - name: Package release
        shell: bash
        run: |
          mkdir -p dist
          archive="dist/adaptive-engineering-$RELEASE_TAG.zip"
          python package_release.py build --tag "$RELEASE_TAG" --ref HEAD --output "$archive"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          cd dist
          sha256sum "adaptive-engineering-$RELEASE_TAG.zip" > SHA256SUMS

      - name: Test extracted bundle
        run: python package_release.py verify "$ARCHIVE"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$ARCHIVE" dist/SHA256SUMS dist/acceptance-source.json \
            --verify-tag --title "Adaptive Engineering $RELEASE_TAG" \
            --generate-notes "${flags[@]}"
